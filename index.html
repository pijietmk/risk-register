<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IT Project Risk Register</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f5f7fa;
    font-size:14px;
}

.header{
    background:#0f172a;
    color:white;
    padding:15px;
    margin-bottom:15px;
}

.card-counter{
    border-left:5px solid;
}

.card-open{
    border-color:#0d6efd;
}

.card-closed{
    border-color:#198754;
}

.card-critical{
    border-color:#dc3545;
}

.card-high{
    border-color:#fd7e14;
}

.table-container{
    width:100%;
    overflow-x:auto;
}

table{
    min-width:3500px;
}

th{
    background:#212529 !important;
    color:white !important;
    white-space:nowrap;
    position:sticky;
    top:0;
    z-index:100;
}

td{
    white-space:nowrap;
    vertical-align:top;
}

.priority-critical{
    background:#dc3545;
    color:white;
}

.priority-high{
    background:#fd7e14;
    color:white;
}

.priority-medium{
    background:#ffc107;
}

.priority-low{
    background:#198754;
    color:white;
}

</style>

</head>

<body>

<div class="header">
    <h2>IT Project Risk Register</h2>
</div>

<div class="container-fluid">

<!-- DASHBOARD -->

<div class="row mb-4">

<div class="col-md-3">
<div class="card card-counter card-open">
<div class="card-body">
<h5>Open Risks</h5>
<h3 id="openCount">0</h3>
</div>
</div>
</div>

<div class="col-md-3">
<div class="card card-counter card-closed">
<div class="card-body">
<h5>Closed Risks</h5>
<h3 id="closedCount">0</h3>
</div>
</div>
</div>

<div class="col-md-3">
<div class="card card-counter card-critical">
<div class="card-body">
<h5>Critical Risks</h5>
<h3 id="criticalCount">0</h3>
</div>
</div>
</div>

<div class="col-md-3">
<div class="card card-counter card-high">
<div class="card-body">
<h5>High Risks</h5>
<h3 id="highCount">0</h3>
</div>
</div>
</div>

</div>

<!-- ADD RISK -->

<div class="card mb-4">

<div class="card-header">
<b>Add New Risk</b>
</div>

<div class="card-body">

<div class="row g-2">

<div class="col-md-2">
<input id="date" type="date" class="form-control">
</div>

<div class="col-md-2">
<input id="logBy" type="text" class="form-control" placeholder="Log By">
</div>

<div class="col-md-8">
<input id="riskDescription" type="text" class="form-control" placeholder="Risk Description">
</div>

<div class="col-md-2">
<select id="priority" class="form-select">
<option>Critical</option>
<option>High</option>
<option>Medium</option>
<option>Low</option>
</select>
</div>

<div class="col-md-4">
<input id="impact" type="text" class="form-control" placeholder="Impact Analysis">
</div>

<div class="col-md-2">
<input id="endDate" type="date" class="form-control">
</div>

<div class="col-md-2">
<input id="owner" type="text" class="form-control" placeholder="Assigned To">
</div>

<div class="col-md-2">
<select id="status" class="form-select">
<option>Open</option>
<option>Mitigated</option>
<option>Closed</option>
</select>
</div>

<div class="col-md-6">
<input id="mitigation" type="text" class="form-control" placeholder="Mitigation Plan / Update">
</div>

<div class="col-md-2">
<select id="industry" class="form-select">
<option>FSI</option>
<option>GGnT</option>
<option>CommH</option>
</select>
</div>

<div class="col-md-2">
<select id="projectType" class="form-select">
<option>Refresh</option>
<option>Relocation</option>
<option>Greenfield</option>
<option>Migration</option>
</select>
</div>

<div class="col-md-2">
<select id="platform" class="form-select">
<option>UNIX</option>
<option>Wintel</option>
<option>Firewall</option>
<option>Switch</option>
<option>CyberSecurity</option>
<option>UC</option>
</select>
</div>

</div>

<button class="btn btn-primary mt-3" onclick="addRisk()">
Add Risk
</button>

<button class="btn btn-success mt-3" onclick="exportCSV()">
Export CSV
</button>

</div>

</div>

<!-- SEARCH -->

<div class="mb-3">
<input type="text"
id="searchText"
class="form-control"
placeholder="Search Risk..."
onkeyup="renderTable()">
</div>

<!-- TABLE -->

<div class="table-container">

<table class="table table-bordered table-hover">

<thead>
<tr>

<th>Risk No</th>
<th>Date</th>
<th>Log By</th>
<th>Risk Description</th>
<th>Risk Priority</th>
<th>Impact Analysis</th>
<th>Risk End Date</th>
<th>Assigned To</th>
<th>Status</th>
<th>Mitigation Plan / Update</th>
<th>Industry</th>
<th>Project Type</th>
<th>Platform</th>
<th>Action</th>

</tr>
</thead>

<tbody id="riskTable"></tbody>

</table>

</div>

</div>

<script>

let risks = JSON.parse(localStorage.getItem("risks")) || [];

function addRisk(){

let riskNumber =
'R' + String(risks.length + 1).padStart(3,'0');

risks.push({

riskNo:riskNumber,
date:date.value,
logBy:logBy.value,
riskDescription:riskDescription.value,
priority:priority.value,
impact:impact.value,
endDate:endDate.value,
owner:owner.value,
status:status.value,
mitigation:mitigation.value,
industry:industry.value,
projectType:projectType.value,
platform:platform.value

});

saveData();

}

function saveData(){

localStorage.setItem(
"risks",
JSON.stringify(risks)
);

renderTable();

}

function deleteRisk(index){

if(confirm("Delete this risk?")){

risks.splice(index,1);

saveData();

}

}

function renderTable(){

let search =
document.getElementById("searchText")
.value
.toLowerCase();

let html="";

risks.forEach((risk,index)=>{

let data =
JSON.stringify(risk)
.toLowerCase();

if(data.includes(search)){

let colorClass="";

if(risk.priority=="Critical")
colorClass="priority-critical";

if(risk.priority=="High")
colorClass="priority-high";

if(risk.priority=="Medium")
colorClass="priority-medium";

if(risk.priority=="Low")
colorClass="priority-low";

html += `
<tr>

<td>${risk.riskNo}</td>
<td>${risk.date}</td>
<td>${risk.logBy}</td>
<td>${risk.riskDescription}</td>
<td class="${colorClass}">
${risk.priority}
</td>
<td>${risk.impact}</td>
<td>${risk.endDate}</td>
<td>${risk.owner}</td>
<td>${risk.status}</td>
<td>${risk.mitigation}</td>
<td>${risk.industry}</td>
<td>${risk.projectType}</td>
<td>${risk.platform}</td>

<td>
<button
class="btn btn-danger btn-sm"
onclick="deleteRisk(${index})">
Delete
</button>
</td>

</tr>
`;

}

});

document.getElementById("riskTable")
.innerHTML = html;

updateDashboard();

}

function updateDashboard(){

document.getElementById("openCount").innerText =
risks.filter(x=>x.status=="Open").length;

document.getElementById("closedCount").innerText =
risks.filter(x=>x.status=="Closed").length;

document.getElementById("criticalCount").innerText =
risks.filter(x=>x.priority=="Critical").length;

document.getElementById("highCount").innerText =
risks.filter(x=>x.priority=="High").length;

}

function exportCSV(){

let csv=[];

csv.push([
"Risk No",
"Date",
"Log By",
"Risk Description",
"Risk Priority",
"Impact Analysis",
"Risk End Date",
"Assigned To",
"Status",
"Mitigation Plan",
"Industry",
"Project Type",
"Platform"
].join(","));

risks.forEach(r=>{

csv.push([

r.riskNo,
r.date,
r.logBy,
`"${r.riskDescription}"`,
r.priority,
`"${r.impact}"`,
r.endDate,
r.owner,
r.status,
`"${r.mitigation}"`,
r.industry,
r.projectType,
r.platform

].join(","));

});

let blob =
new Blob(
[csv.join("\n")],
{type:"text/csv"}
);

let link =
document.createElement("a");

link.href =
URL.createObjectURL(blob);

link.download =
"RiskRegister.csv";

link.click();

}

renderTable();

</script>

</body>
</html>
